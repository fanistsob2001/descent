<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Descent</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Κατά τη διάρκεια του παιχνιδιού -->
  <div id="hud" class="hidden">
    <button id="btn-pause" class="hud-btn" type="button" aria-label="Pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <div id="level-label"></div>
    <button id="btn-lure" class="hud-btn" type="button" aria-label="Throw lure">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
      <span id="lure-count">0</span>
    </button>
  </div>
  <div id="hint"></div>
  <div id="level-intro"><p id="intro-number"></p><p id="intro-name"></p><p id="intro-line"></p></div>

  <!-- Αρχικό μενού -->
  <div id="menu" class="overlay">
    <h1>DESCENT</h1>
    <button id="btn-continue" class="btn" type="button" data-action="continue">Continue</button>
    <button id="btn-new" class="btn" type="button" data-action="new">New Game</button>
    <button class="btn" type="button" data-action="settings">Settings</button>
    <p class="headphones">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>
      Wear headphones
    </p>
    <p class="controls touch-only">Left side: move &middot; Right side: sound</p>
    <p class="controls keys-only">WASD move &middot; Shift sneak &middot; Space sound &middot; E lure &middot; Esc pause</p>
  </div>

  <div id="settings" class="overlay hidden">
    <h2>Settings</h2>
    <button class="btn sound-toggle" type="button" data-action="sound">Sound: on</button>
    <button class="btn vibration-toggle" type="button" data-action="vibration">Vibration: on</button>
    <button class="btn primary" type="button" data-action="back">Back</button>
  </div>

  <div id="pause" class="overlay hidden">
    <h2>Paused</h2>
    <p id="pause-chapter" class="small-label"></p>
    <p id="pause-objective" class="objective"></p>
    <button class="btn primary" type="button" data-action="resume">Resume</button>
    <button class="btn sound-toggle" type="button" data-action="sound">Sound: on</button>
    <button class="btn vibration-toggle" type="button" data-action="vibration">Vibration: on</button>
    <button class="btn" type="button" data-action="menu">Main menu</button>
  </div>

  <!-- Προσωρινό τέλος (τα κανονικά τέλη έρχονται στο στάδιο 3) -->
  <div id="end" class="overlay end hidden">
    <h2>Light.</h2>
    <button class="btn primary" type="button" data-action="menu">Main menu</button>
  </div>

  <div id="rotate" class="overlay">
    <p>Turn your phone upright</p>
  </div>

  <script src="js/levels.js"></script>
  <script src="js/level.js"></script>
  <script src="js/echo.js"></script>
  <script src="js/input.js"></script>
  <script src="js/monster.js"></script>
  <script src="js/exit.js"></script>
  <script src="js/lure.js"></script>
  <script src="js/hints.js"></script>
  <script src="js/save.js"></script>
  <script src="js/altar.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/dread.js"></script>
  <script src="js/scare.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
